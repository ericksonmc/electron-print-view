appId: com.dataweb.cdapuestas.webview
productName: cdapuestas_webview
# El ejecutable, el comando en /usr/bin y el .desktop quedan como
# 'cdapuestas-webview' (lo que ya usa la flota y los scripts del supervisor).
# Sin esto, electron-builder toma el name de package.json (cdapuestas-print-view)
# y el update deja colgado el comando 'cdapuestas-webview' en cada máquina.
executableName: cdapuestas-webview
artifactName: cdapuestas-webview-setup-${version}.${ext}

directories:
  buildResources: build
  output: dist/full

files:
  - "**/*"
  - "!legacy/**"
  - "!packaging/**"
  - "!docs/**"
  - "!tools/**"
  - "!src/service/**"
  # dist/ (salida del build) y releases/ (catálogo con los .deb) no son parte de
  # la app; sin esto se empaquetan dentro del asar y cada build siguiente infla
  # el .deb de forma recursiva (dist/full del build anterior metido adentro).
  - "!dist/**"
  - "!releases/**"
  - "!**/*.{deb,AppImage,rpm,snap,exe,dmg}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"

asarUnpack:
  - "**/node_modules/usb/**"
  - "**/node_modules/escpos-usb/**"
  - "**/node_modules/@thiagoelg/node-printer/**"

publish:
  provider: github
  owner: ericksonmc
  repo: electron-print-view
  releaseType: release

mac:
  target:
    - dmg
    - zip
  icon: build/icons/cdapuestas.icns

linux:
  target:
    - AppImage
    - deb
  icon: build/icons/cdapuestas.png
  category: Utility
  maintainer: Dataweb C.A.
  description: Aplicación para cdapuestas
  desktop:
    StartupWMClass: Printer Webview
  files:
    - "**/*"
    - "!temp/**/*"
    - "!**/*.tmp"
    - "!dist/**"
    - "!releases/**"

# El nombre del paquete queda fijo en 'cdapuestas-webview' (el que ya tiene toda
# la flota instalada). Si cambia, dpkg lo trata como paquete nuevo y choca por
# los archivos compartidos en /opt/cdapuestas_webview al actualizar por USB.
deb:
  packageName: cdapuestas-webview
  afterInstall: build/linux/after-install.tpl

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  icon: build/icons/cdapuestas.ico
  legalTrademarks: Dataweb
  publisherName: Dataweb C.A.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icons/cdapuestas.ico
  uninstallerIcon: build/icons/cdapuestas.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  artifactName: "${productName}-Setup-${version}.${ext}"
